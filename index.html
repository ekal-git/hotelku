<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1620">
<title>HotelKu - Reservasi Hotel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="image" href="img/wallpaper.webp" type="image/webp">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head>
<body class="login-page">
<div class="stage" aria-hidden="true">
  <div class="bg"></div><div class="tint"></div>
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
  <div class="shine"></div><canvas data-dust></canvas>
</div>
<div id="nav"></div>
<main class="login-wrap">
  <header class="login-brand">
    <div id="brandLogo"></div>
    <h1>HOTELKU</h1>
    <div class="sub">SISTEM INFORMASI HOTEL</div>
    <p class="tag">Pengalaman menginap yang lebih mudah dengan teknologi.</p>
  </header>

  <section class="auth-card glass">
    <div class="seg" id="seg" data-on="0" role="tablist">
      <i></i>
      <button type="button" class="on" data-p="pl" role="tab">Masuk</button>
      <button type="button" data-p="pr" role="tab">Daftar</button>
    </div>

    <div class="pane on" id="pl">
      <h3>Selamat datang kembali</h3>
      <p class="hint">Masuk untuk memesan kamar dan melihat riwayat reservasi.</p>
      <div id="msgL" class="msg-error"></div>
      <div class="field" style="--n:0"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3.5 7.5l8.5 6 8.5-6"/></svg>
        <input id="le" type="email" class="form-control" placeholder="Email" autocomplete="email"></div>
      <div class="field" style="--n:1"><svg viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10" rx="3"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>
        <input id="lp" type="password" class="form-control" placeholder="Kata sandi" autocomplete="current-password"></div>
      <div class="field" style="--n:2"><button id="bl" class="btn btn-brass w-100">Masuk</button></div>
    </div>

    <div class="pane" id="pr">
      <h3>Daftar sebagai tamu</h3>
      <p class="hint">Buat akun dalam satu menit, lalu pesan kamar tanpa antre.</p>
      <div id="msgR" class="msg-error"></div>
      <div class="field" style="--n:0"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
        <input id="rn" class="form-control" placeholder="Nama lengkap" autocomplete="name"></div>
      <div class="field" style="--n:1"><svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="3"/><path d="M11 18.5h2"/></svg>
        <input id="rh" class="form-control" placeholder="Nomor HP" inputmode="tel" autocomplete="tel"></div>
      <div class="field" style="--n:2"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3.5 7.5l8.5 6 8.5-6"/></svg>
        <input id="re" type="email" class="form-control" placeholder="Email" autocomplete="email"></div>
      <div class="field" style="--n:3"><svg viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10" rx="3"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>
        <input id="rp" type="password" class="form-control" placeholder="Kata sandi (min. 6 karakter)" autocomplete="new-password"></div>
      <div class="field" style="--n:4"><button id="br" class="btn btn-brass w-100">Daftar</button></div>
    </div>
  </section>
</main>
<div id="foot"></div>
<script type="module">
import { auth, db } from "./js/firebase-config.js";
import { $, LOGO, footer } from "./js/common.js";
import { signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
$("brandLogo").innerHTML = LOGO;
footer();
/* ganti tampilan Masuk / Daftar (UI saja) */
document.querySelectorAll("#seg button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("#seg button").forEach(x => x.classList.toggle("on", x === b));
  $("seg").dataset.on = b.dataset.p === "pr" ? "1" : "0";
  document.querySelectorAll(".pane").forEach(p => p.classList.toggle("on", p.id === b.dataset.p));
}));
const go = async u => {
  const s = await getDoc(doc(db, "users", u.uid));
  location = s.exists() && s.data().role === "admin" ? "admin.html" : "tamu.html";
};
$("bl").onclick = async () => {
  $("msgL").textContent = ""; $("bl").classList.add("loading");
  try { go((await signInWithEmailAndPassword(auth, $("le").value, $("lp").value)).user); }
  catch { $("msgL").textContent = "Email atau kata sandi salah."; $("bl").classList.remove("loading"); }
};
$("br").onclick = async () => {
  $("msgR").textContent = "";
  if (!$("rn").value.trim()) return ($("msgR").textContent = "Nama wajib diisi.");
  $("br").classList.add("loading");
  try {
    const u = (await createUserWithEmailAndPassword(auth, $("re").value, $("rp").value)).user;
    await setDoc(doc(db, "users", u.uid), { nama: $("rn").value.trim(), hp: $("rh").value, email: $("re").value, role: "tamu" });
    go(u);
  } catch (e) { $("msgR").textContent = e.code === "auth/email-already-in-use" ? "Email sudah terdaftar." : "Pendaftaran gagal. Periksa email dan kata sandi (min. 6 karakter)."; $("br").classList.remove("loading"); }
};
</script></body></html>
