<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1620">
<title>HotelKu - Tamu</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head>
<body>
<div id="nav"></div>
<header class="hero-banner noprint">
  <div class="hb"></div><canvas data-dust></canvas>
  <div class="container">
    <p class="mb-2 small">Halo, <span id="greet" class="gold">tamu</span></p>
    <h1>Temukan kamar untuk istirahat terbaikmu.</h1>
    <p class="mt-3 mb-0">Pilih tanggal, pesan kamar, cetak struk, lalu bayar di kasir saat tiba.</p>
  </div>
</header>
<main class="container float-up pb-2">
  <div class="tabs noprint mb-3">
    <button class="on" data-t="cari"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><span>Cari kamar</span></button>
    <button data-t="riwayat"><svg viewBox="0 0 24 24"><path d="M7 3.5h10a1.5 1.5 0 0 1 1.5 1.5v15l-2.2-1.4-2.1 1.4-2.2-1.4-2.1 1.4-2.2-1.4L5.5 20V5A1.5 1.5 0 0 1 7 3.5z"/><path d="M9 9h6M9 12.5h4"/></svg><span>Riwayat reservasi</span></button>
  </div>
  <section id="cari" class="sec on">
    <div class="panel mb-3"><div class="row g-2 align-items-end">
      <div class="col-6 col-md-3"><label class="small">Check-in</label><input id="ci" type="date" class="form-control"></div>
      <div class="col-6 col-md-3"><label class="small">Check-out</label><input id="co" type="date" class="form-control"></div>
      <div class="col-6 col-md-3"><label class="small">Jumlah tamu</label><input id="jt" type="number" min="1" value="1" class="form-control"></div>
      <div class="col-6 col-md-3"><button id="bc" class="btn btn-ink w-100">Cari kamar kosong</button></div>
    </div><div id="msg" class="msg-error small mt-2"></div></div>
    <div id="hasil" class="row g-3"></div>
  </section>
  <section id="riwayat" class="sec"><div class="panel table-wrap"><table class="table table-stack align-middle mb-0">
    <thead><tr><th>Kode</th><th>Kamar</th><th>Tanggal</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody id="rb"></tbody></table></div></section>
</main>
<div id="foot"></div>
<script type="module">
import { db } from "./js/firebase-config.js";
import { $, rp, tgl, malam, kodeBooking, badge, guard, showStruk, toast, uiConfirm, burst, skeleton } from "./js/common.js";
import { collection, getDocs, addDoc, updateDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
let ME, H = {}, RM = {};
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button,.sec").forEach(e => e.classList.remove("on"));
  b.classList.add("on"); $(b.dataset.t).classList.add("on");
  if (b.dataset.t === "riwayat") riwayat();
});
const today = new Date().toISOString().slice(0, 10);
$("ci").min = $("co").min = today;
guard("tamu", me => { ME = me; $("greet").textContent = me.nama; });

$("bc").onclick = async () => {
  const a = $("ci").value, b = $("co").value, n = +$("jt").value;
  $("msg").textContent = ""; $("hasil").innerHTML = "";
  if (!a || !b || b <= a) return ($("msg").textContent = "Pilih tanggal check-in dan check-out yang valid (check-out setelah check-in).");
  $("hasil").innerHTML = skeleton(3);
  const rooms = (await getDocs(collection(db, "rooms"))).docs.map(d => ({ id: d.id, ...d.data() }));
  const rsv = (await getDocs(collection(db, "reservations"))).docs.map(d => d.data()).filter(r => r.status !== "batal" && r.status !== "selesai");
  const free = rooms.filter(r => r.status === "tersedia" && r.kapasitas >= n &&
    !rsv.some(v => v.roomId === r.id && v.in < b && v.out > a));
  RM = Object.fromEntries(free.map(r => [r.id, r]));
  if (!free.length) return ($("hasil").innerHTML = `<div class="col-12"><div class="panel empty-state"><svg viewBox="0 0 24 24"><path d="M3 18V8m0 5h18v5M21 18v-3.5A3.5 3.5 0 0 0 17.5 11H11v2"/><circle cx="7" cy="10.5" r="1.8"/></svg><p class="mb-0">Tidak ada kamar kosong pada tanggal tersebut. Coba ubah tanggal atau jumlah tamu.</p></div></div>`);
  const m = malam(a, b);
  $("hasil").innerHTML = free.map((r, i) => `<div class="col-md-6 col-lg-4"><article class="room-card" style="--i:${i}">
    <div class="room-vis t-${String(r.tipe).toLowerCase()}"><span class="chip-type">${r.tipe}</span><span class="room-no">Kamar ${r.noKamar}</span></div>
    <div class="room-body">
    <h4>Kamar ${r.noKamar} - ${r.tipe}</h4>
    <div class="cap"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 19a6 6 0 0 1 12 0"/><path d="M16 5.2a3.2 3.2 0 0 1 0 5.6M18.5 14.5A6 6 0 0 1 21 19"/></svg>Kapasitas ${r.kapasitas} orang</div>
    <div class="chips">${(r.fasilitas || "").split(",").map(f => f.trim()).filter(Boolean).map(f => `<span class="chip">${f}</span>`).join("")}</div>
    <div class="price"><b>${rp(r.harga)}</b><span>/ malam</span></div><p class="total">Total ${m} malam: ${rp(r.harga * m)}</p>
    <button class="btn btn-brass w-100" onclick="pesan('${r.id}')">Pesan kamar ini</button></div></article></div>`).join("");
};
window.pesan = async id => {
  const r = RM[id], a = $("ci").value, b = $("co").value, m = malam(a, b);
  if (!await uiConfirm(`Pesan kamar ${r.noKamar} untuk ${m} malam, total ${rp(r.harga * m)}?`, { title: "Pesan kamar ini?", ok: "Ya, pesan" })) return;
  const data = { kode: kodeBooking(), userId: ME.id, nama: ME.nama, roomId: id, noKamar: r.noKamar, tipe: r.tipe, harga: r.harga,
    in: a, out: b, tamu: +$("jt").value, malam: m, total: r.harga * m, status: "pending", lunas: false, dibuat: Date.now() };
  await addDoc(collection(db, "reservations"), data);
  $("hasil").innerHTML = ""; showStruk(data); toast("Reservasi berhasil dibuat", "success"); burst();
};
async function riwayat() {
  const s = await getDocs(query(collection(db, "reservations"), where("userId", "==", ME.id)));
  const l = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((x, y) => y.dibuat - x.dibuat);
  H = Object.fromEntries(l.map(r => [r.id, r]));
  $("rb").innerHTML = l.length ? l.map(r => `<tr><td>${r.kode}</td><td>${r.noKamar} (${r.tipe})</td>
    <td>${tgl(r.in)} - ${tgl(r.out)}</td><td>${rp(r.total)}${r.lunas ? " (lunas)" : ""}</td><td>${badge(r.status)}</td>
    <td class="text-nowrap"><button class="btn btn-sm btn-ink" onclick="struk('${r.id}')">Struk</button>
    ${r.status === "pending" ? `<button class="btn btn-sm btn-outline-danger" onclick="batal('${r.id}')">Batalkan</button>` : ""}</td></tr>`).join("")
    : `<tr><td colspan="6">Belum ada reservasi. Buka tab Cari kamar untuk memesan.</td></tr>`;
}
window.struk = id => showStruk(H[id]);
window.batal = async id => { if (await uiConfirm("Batalkan reservasi ini?", { title: "Batalkan reservasi", ok: "Ya, batalkan", cancel: "Tidak", danger: true })) { await updateDoc(doc(db, "reservations", id), { status: "batal" }); riwayat(); toast("Reservasi dibatalkan", "info"); } };
</script></body></html>
